# Root compose entrypoint for Dokploy / one-command deploys.
#
#   docker compose up -d --build
#
# The real stack lives in project/docker-compose.yml; this file only fixes the
# build context to the project/ workspace so paths resolve the same whether the
# deploy platform points at the repo root or at project/.
#
# Env: platform writes .env next to THIS file (repo root). Copy from
# project/.env.example and fill in keys. Every integration degrades gracefully
# if a key is blank.

services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first boot, then just confirms it is primary.
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }
        "
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7
    # AOF on: config.ts only trusts Redis as a durable journal when appendonly=yes.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./project
      dockerfile: apps/server/Dockerfile
    image: kisanpool-server:latest
    env_file:
      # Optional: only used if present. Platform-injected env vars still apply.
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "4000"
      MONGODB_URI: mongodb://mongo:27017/kisanpool?replicaSet=rs0
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    volumes:
      # Persist the on-disk recovery journal across restarts.
      - server-data:/repo/apps/server/.data
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:
  server-data:
