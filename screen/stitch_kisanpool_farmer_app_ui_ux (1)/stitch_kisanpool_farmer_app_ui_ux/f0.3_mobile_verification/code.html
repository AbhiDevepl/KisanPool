<header class="bg-background w-full top-0 sticky flex items-center px-edge-margin h-14 z-50">

</div>
<!-- Input Section -->

<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1" for="mobile">मोबाईल नंबर</label>
<div class="relative flex items-center bg-surface-container-lowest border border-outline-variant rounded-lg overflow-hidden focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-shadow">
<!-- Country Code / Flag (Simulated) -->
<div class="flex items-center pl-3 pr-2 py-3 border-r border-outline-variant bg-surface-container-lowest">
<img alt="IN Flag" class="w-6 h-4 object-cover rounded-sm mr-2 shadow-sm" data-alt="A small, crisp, perfectly rectangular icon of the Indian flag with its saffron, white, and green horizontal stripes and navy blue Ashoka Chakra in the center, rendered in a flat modern UI style suitable for a mobile app input field." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCjypzztghuQjjZNjOSzfodujp565tKOLE6rAt7Qwnwb1xuiqPJB1bcM_GcWNMyoUun91TjhtJIM4Hu_gS2DyIj_1zNbqJcxTVVafeEbgZpxXCjSA119KvvWPFi9dp_r4y4V0v5XJqYnFjQDdXGpohketqoivNyR-knmmRQIuQDEdOoKVcSjNQqU0-U1PCs_R2kreIXLp3ntsWVY0nVEr8Cc76kR7ujyDge-1DqMy9L-4RSgp15WNgE">

</div>
<!-- Input Field -->
<input autocomplete="tel" class="w-full bg-transparent border-none py-3 px-3 font-body-lg text-body-lg text-on-surface focus:ring-0 placeholder:text-outline" id="mobile" placeholder="98765 43210" type="tel">
</div>
</div>
<!-- Action Button -->
<button class="w-full flex items-center justify-center gap-2 bg-primary-container text-on-primary font-label-lg text-label-lg py-4 px-6 rounded-lg active:scale-[0.98] transition-transform shadow-md mt-lg">
<span>OTP पाठवा</span>
<span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
<!-- Terms Text -->
<div class="text-center mt-md">
<p class="font-bilingual-subtext text-bilingual-subtext text-on-surface-variant">
                    By continuing, you agree to our<br>
<a class="text-primary font-medium hover:underline" href="#">Terms &amp; Conditions and Privacy Policy</a>
</p>
