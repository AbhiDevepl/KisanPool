<!DOCTYPE html><html class="light" lang="en"><head>

<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col items-center justify-center font-body-md">
<!-- Mobile App Container -->
<div class="w-full max-w-md h-[100dvh] md:h-[850px] md:rounded-[40px] md:shadow-2xl bg-surface relative overflow-hidden flex flex-col md:my-8 border-x md:border-8 border-surface-container-high">
<!-- Status Bar Placeholder -->
<div class="h-12 w-full flex justify-between items-center px-6 text-sm font-medium bg-surface z-50 shrink-0">
<span>9:41</span>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[16px]">wifi</span>
<span class="material-symbols-outlined text-[16px]">battery_full</span>
</div>
</div>
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-background flex items-center justify-between px-edge-margin h-14 shrink-0 z-40 transition-transform active:scale-[0.98]">
<button aria-label="Go back" class="p-2 -ml-2 rounded-full hover:bg-surface-container-low transition-colors text-on-surface">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex-1 px-4 flex items-center">
<div class="w-full h-1 bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary-container w-[80%] rounded-full"></div>
</div>
</div>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto px-edge-margin pb-32">
<!-- Header Section -->
<div class="mt-lg mb-xl">
<h1 class="font-headline-lg text-headline-lg-mobile text-on-surface mb-xs">माहिती पूर्ण करा</h1>
<p class="font-body-md text-body-md text-on-surface-variant">कृपया आपली माहिती भरा</p>
</div>
<!-- Profile Form Container -->
<div class="bg-surface-container-lowest rounded-xl p-md shadow-[0px_4px_12px_rgba(0,0,0,0.05)] border border-surface-container-low mb-lg relative overflow-hidden">
<!-- Role Indicator Badge -->
<div class="inline-flex items-center gap-2 bg-surface-container-low rounded-full px-3 py-1 mb-6">
<span class="material-symbols-outlined text-primary-container text-sm" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label-sm text-label-sm text-on-surface font-medium">भूमिका: शेतकरी</span>
</div>
<!-- Profile Picture Upload -->
<div class="flex justify-center mb-xl">
<div class="relative">
<div class="w-24 h-24 rounded-full bg-surface-container-high flex items-center justify-center border-4 border-surface shadow-sm">
<span class="material-symbols-outlined text-4xl text-on-surface-variant">person</span>
</div>
<button class="absolute bottom-0 right-0 bg-primary-container text-on-primary w-8 h-8 rounded-full flex items-center justify-center shadow-md border-2 border-surface hover:bg-primary transition-colors active:scale-95">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</button>
</div>
</div>
<!-- Form Fields -->
<form class="space-y-lg">
<!-- Full Name Field -->
<div class="space-y-sm">
<label class="block font-label-sm text-label-sm text-on-surface" for="fullName">पूर्ण नाव</label>
<input class="w-full h-12 px-4 rounded-lg border border-outline-variant bg-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors font-body-md text-on-surface placeholder-on-surface-variant/50" id="fullName" placeholder="उदा. नामदेव पाटील" type="text">
</div>
<!-- Village/City Field -->
<div class="space-y-sm">
<label class="block font-label-sm text-label-sm text-on-surface" for="location">गाव / शहर</label>
<input class="w-full h-12 px-4 rounded-lg border border-outline-variant bg-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors font-body-md text-on-surface placeholder-on-surface-variant/50" id="location" placeholder="उदा. कराड, सातारा" type="text">
</div>
<!-- Taluka Field -->
<div class="space-y-sm">
<label class="block font-label-sm text-label-sm text-on-surface" for="taluka">तालुका</label>
<input class="w-full h-12 px-4 rounded-lg border border-outline-variant bg-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors font-body-md text-on-surface placeholder-on-surface-variant/50" id="taluka" placeholder="उदा. कराड" type="text">
</div>
<!-- Mobile Number Confirmation (Read-only) -->
<div class="space-y-sm mt-md p-4 bg-surface-container-low rounded-lg border border-surface-container-highest">
<label class="block font-label-sm text-label-sm text-on-surface-variant">नोंदणीकृत मोबाईल नंबर</label>
<div class="flex items-center justify-between">
<span class="font-body-md text-on-surface font-medium">+91 98765 43210</span>
<span class="material-symbols-outlined text-primary-container text-sm" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</form>
</div>
<!-- Trust Badge -->
<div class="flex items-center justify-center gap-2 text-on-surface-variant mt-lg opacity-80">
<span class="material-symbols-outlined text-sm">verified_user</span>
<span class="font-label-sm text-label-sm">सुरक्षित आणि खात्रीशीर</span>
</div>
</main>
<!-- Bottom Action Area -->
<div class="absolute bottom-0 left-0 w-full p-edge-margin bg-surface bg-opacity-90 backdrop-blur-md border-t border-surface-container-highest z-50 shrink-0 pb-safe">
<button class="w-full h-12 bg-primary-container text-on-primary rounded-lg font-label-lg text-label-lg flex items-center justify-center gap-2 hover:bg-primary transition-colors active:scale-[0.98] shadow-md shadow-primary-container/20">
<span>पुढे जा</span>
<span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</div>
<!-- Home Indicator Placeholder -->
<div class="absolute bottom-1 left-1/2 -translate-x-1/2 w-32 h-1.5 bg-on-surface/20 rounded-full z-50"></div>
</div>
</body></html>
