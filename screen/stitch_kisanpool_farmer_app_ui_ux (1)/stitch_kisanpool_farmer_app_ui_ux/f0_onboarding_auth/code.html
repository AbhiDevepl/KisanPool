</div>
<div class="flex-1 p-edge-margin flex flex-col pt-4">

</button>

<span class="font-label-sm text-label-sm">सुरक्षित, विश्वासार्ह आणि पारदर्शक प्लॅटफॉर्म</span>
</div>
</div>
</div>
<!-- Navigation Script -->
<script>
        function nextScreen(screenId) {
            document.querySelectorAll('body > div').forEach(el => el.classList.add('hidden'));
            const target = document.getElementById(screenId);
            if(target) {
                target.classList.remove('hidden');
                target.classList.add('flex');
            }
        }
        function prevScreen(screenId) {
            document.querySelectorAll('body > div').forEach(el => el.classList.add('hidden'));
            const target = document.getElementById(screenId);
            if(target) {
                target.classList.remove('hidden');
                target.classList.add('flex');
            }
        }
    </script>
</body></html>
